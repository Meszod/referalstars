services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres        # PRODUCTION'da o'zgartiring (DATABASE_URL ham mos bo'lsin)
      POSTGRES_DB: referral_bot
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"            # faqat lokal (alembic/psql uchun)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d referral_bot"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    # Migratsiyalar bot ishga tushishidan oldin avtomatik qo'llanadi
    command: ["sh", "-c", "alembic upgrade head && python -m app.bot"]

volumes:
  pgdata:
  redisdata:
